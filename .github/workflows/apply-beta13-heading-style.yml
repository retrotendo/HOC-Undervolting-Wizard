name: Apply beta13 heading style

on:
  push:
    branches:
      - beta13-app-heading-style
    paths:
      - 'tools/apply_beta13_heading_style.py'
      - '.github/workflows/apply-beta13-heading-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta13-app-heading-style
      - run: python3 tools/apply_beta13_heading_style.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp Makefile UPDATE.txt README.md CHANGELOG.md
          git commit -m "beta13: add app heading hierarchy" || exit 0
          git push origin beta13-app-heading-style
