name: Apply beta14 CPU Settings fix

on:
  push:
    branches:
      - beta14-cpu-settings-menu-fix
    paths:
      - 'tools/apply_beta14_cpu_settings_fix.py'
      - '.github/workflows/apply-beta14-cpu-settings-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-cpu-settings-menu-fix
      - run: python3 tools/apply_beta14_cpu_settings_fix.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp Makefile UPDATE.txt README.md CHANGELOG.md
          git commit -m "beta14: use real Horizon OC CPU Settings menu" || exit 0
          git push origin beta14-cpu-settings-menu-fix
