name: Apply beta14 menu cleanup

on:
  push:
    branches:
      - beta14-cpu-settings-menu-fix
    paths:
      - '.github/workflows/apply-beta14-menu-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-cpu-settings-menu-fix
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/main.cpp')
          s = p.read_text()
          old = '''        case Stage::LowVminQuick:\n            uiPrintf(row++, "CPU Settings:");\n            uiPrintf(row++, " - Low UV   : %d", g.lowUvGood);\n            uiPrintf(row++, "CPU Settings:");\n            uiPrintf(row++, " - Low VMIN : %d mV", g.lowVminTest);\n            uiPrintf(row++, "Action   : Reboot CFW");\n            break;\n'''
          new = '''        case Stage::LowVminQuick:\n            uiPrintf(row++, "CPU Settings:");\n            uiPrintf(row++, " - Low UV   : %d", g.lowUvGood);\n            uiPrintf(row++, " - Low VMIN : %d mV", g.lowVminTest);\n            uiPrintf(row++, "Action   : Reboot CFW");\n            break;\n'''
          if old not in s:
              raise SystemExit('Low VMIN duplicate heading block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "beta14: remove duplicate CPU Settings heading"
          git push origin beta14-cpu-settings-menu-fix
