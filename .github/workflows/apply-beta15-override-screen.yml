name: Apply beta15 override screen

on:
  push:
    branches:
      - beta15-override-screen
    paths:
      - 'tools/apply_beta15_override_screen.py'
      - '.github/workflows/apply-beta15-override-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta15-override-screen
      - run: python3 tools/apply_beta15_override_screen.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp Makefile UPDATE.txt README.md CHANGELOG.md
          git commit -m "beta15: redesign blocked override screen" || exit 0
          git push origin beta15-override-screen
