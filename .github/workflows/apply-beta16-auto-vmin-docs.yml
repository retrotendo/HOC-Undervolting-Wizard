name: Apply beta16 automatic VMIN docs

on:
  push:
    branches:
      - beta16-guided-reboot-vmin-plateaus
    paths:
      - '.github/workflows/apply-beta16-auto-vmin-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta16-guided-reboot-vmin-plateaus
      - name: Update automatic VMIN documentation
        run: python3 tools/update_beta16_auto_vmin_docs.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "beta16: document automatic VMIN override scan"
          git push origin HEAD:beta16-guided-reboot-vmin-plateaus
