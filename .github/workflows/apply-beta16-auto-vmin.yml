name: Apply beta16 automatic VMIN scan

on:
  push:
    branches:
      - beta16-guided-reboot-vmin-plateaus
    paths:
      - '.github/workflows/apply-beta16-auto-vmin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta16-guided-reboot-vmin-plateaus
      - name: Apply automatic VMIN override scan
        run: python3 tools/apply_beta16_auto_vmin.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git diff --cached --quiet && exit 0
          git commit -m "beta16: automate VMIN temporary override scan"
          git push origin HEAD:beta16-guided-reboot-vmin-plateaus
