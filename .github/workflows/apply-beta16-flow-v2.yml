name: Apply beta16 guided flow v2

on:
  push:
    branches:
      - beta16-guided-reboot-vmin-plateaus
    paths:
      - '.github/workflows/apply-beta16-flow-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta16-guided-reboot-vmin-plateaus
      - name: Make helper parser tolerate C++ digit separators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_beta16_flow.py')
          s=p.read_text()
          s=s.replace('    in_char = False\n','')
          s=s.replace('''        elif in_char:\n            if esc: esc = False\n            elif c == '\\\\': esc = True\n            elif c == "'": in_char = False\n''','')
          s=s.replace('            elif c == "\'": in_char = True\n','')
          p.write_text(s)
          PY
      - name: Apply beta16 source transformation
        run: python3 tools/apply_beta16_flow.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile
          git diff --cached --quiet && exit 0
          git commit -m "beta16: guided reboot and VMIN plateau flow"
          git push origin HEAD:beta16-guided-reboot-vmin-plateaus
