name: Apply beta16 guided flow

on:
  push:
    branches:
      - beta16-guided-reboot-vmin-plateaus
    paths:
      - 'tools/apply_beta16_flow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta16-guided-reboot-vmin-plateaus
      - name: Apply beta16 source transformation
        run: python3 tools/apply_beta16_flow.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile
          git diff --cached --quiet && exit 0
          git commit -m "beta16: guided reboot and VMIN plateau flow"
          git push origin HEAD:beta16-guided-reboot-vmin-plateaus
