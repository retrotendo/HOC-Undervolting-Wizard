name: Apply beta16 post cleanup

on:
  push:
    branches:
      - beta16-guided-reboot-vmin-plateaus
    paths:
      - '.github/workflows/apply-beta16-post.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta16-guided-reboot-vmin-plateaus
      - name: Apply post-generation cleanup
        run: python3 tools/fix_beta16_post.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git diff --cached --quiet && exit 0
          git commit -m "beta16: clean guided flow UI and config checks"
          git push origin HEAD:beta16-guided-reboot-vmin-plateaus
