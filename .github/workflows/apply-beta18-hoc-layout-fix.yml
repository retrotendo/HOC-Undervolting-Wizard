name: Apply beta18 HOC layout fix

on:
  push:
    branches:
      - beta18-hoc260-hardware-layout
    paths:
      - 'tools/apply_beta18_hoc_layout_fix.py'
      - '.github/workflows/apply-beta18-hoc-layout-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply beta18 patch
        run: python3 tools/apply_beta18_hoc_layout_fix.py
      - name: Build patched source
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "retrotendo"
          git -C "$GITHUB_WORKSPACE" config user.email "info@retrotendo.de"
          git -C "$GITHUB_WORKSPACE" add source/hoc_monitor.c Makefile UPDATE.txt RELEASE_NOTES_v0.4.0-beta.18.md
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then exit 0; fi
          git -C "$GITHUB_WORKSPACE" commit -m "beta18: support HOC 2.6.0 hardware context layout"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta18-hoc260-hardware-layout
