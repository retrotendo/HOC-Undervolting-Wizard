name: Apply beta19 hardware debug

on:
  push:
    branches:
      - beta19-hardware-debug
    paths:
      - 'tools/apply_beta19_debug.py'
      - '.github/workflows/apply-beta19-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply beta19 patch
        run: python3 tools/apply_beta19_debug.py
      - name: Build patched source
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "retrotendo"
          git -C "$GITHUB_WORKSPACE" config user.email "info@retrotendo.de"
          git -C "$GITHUB_WORKSPACE" add source/hoc_monitor.h source/hoc_monitor.c source/main.cpp Makefile UPDATE.txt RELEASE_NOTES_v0.4.0-beta.19.md
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then exit 0; fi
          git -C "$GITHUB_WORKSPACE" commit -m "beta19: add hardware detection debug readout"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta19-hardware-debug
