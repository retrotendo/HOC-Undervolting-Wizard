name: Apply beta20 HOC 2.6.0 layout fix

on:
  push:
    branches:
      - beta20-hoc260-layout-fix
    paths:
      - '.github/workflows/apply-beta20-layout-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: beta20-hoc260-layout-fix
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/apply_beta20.py

      - name: Build beta20
        run: make -j2

      - name: Commit beta20 source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/hoc_monitor.c source/hoc_monitor.h source/main.cpp Makefile
          git -C "$GITHUB_WORKSPACE" commit -m "Fix HOC 2.6.0 hardware context layout for beta20"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta20-hoc260-layout-fix
