name: Apply beta21 HOC 2.6.0 layout fix

on:
  push:
    branches:
      - beta21-correct-hoc260-hardware-layout
    paths:
      - '.github/workflows/apply-beta21-layout-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta21-correct-hoc260-hardware-layout
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta21.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/hoc_monitor.c Makefile
          git -C "$GITHUB_WORKSPACE" commit -m "Fix HOC 2.6.0 hardware offsets for beta21"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta21-correct-hoc260-hardware-layout
