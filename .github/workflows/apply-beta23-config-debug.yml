name: Apply beta23 preparation config debug

on:
  push:
    branches:
      - beta23-preparation-config-debug
    paths:
      - '.github/workflows/apply-beta23-config-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta23-preparation-config-debug
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta23.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/hoc_monitor.h source/hoc_monitor.c source/main.cpp Makefile UPDATE.txt
          git -C "$GITHUB_WORKSPACE" commit -m "Add preparation raw config debug for beta23"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta23-preparation-config-debug
