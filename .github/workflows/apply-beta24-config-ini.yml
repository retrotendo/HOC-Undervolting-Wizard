name: Apply beta24 config.ini persistent settings

on:
  push:
    branches:
      - beta24-config-ini-final
    paths:
      - '.github/workflows/apply-beta24-config-ini.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta24-config-ini-final
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta24.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/main.cpp Makefile UPDATE.txt
          git -C "$GITHUB_WORKSPACE" commit -m "Read persistent HOC settings from config.ini in beta24"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta24-config-ini-final
