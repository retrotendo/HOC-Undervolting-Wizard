name: Apply beta26 preparation UI and reboot recovery help

on:
  push:
    branches:
      - beta26-prep-ui-reboot-help
    paths:
      - '.github/scripts/apply_beta26.py'
      - '.github/workflows/apply-beta26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta26-prep-ui-reboot-help
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta26.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/main.cpp Makefile UPDATE.txt
          git -C "$GITHUB_WORKSPACE" commit -m "Clean preparation UI and add reboot recovery help in beta26"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta26-prep-ui-reboot-help
