name: Apply beta27 no-boot recovery optimization

on:
  push:
    branches:
      - beta27-lowuv-step-test-loop
    paths:
      - '.github/workflows/apply-beta27-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta27-lowuv-step-test-loop
          fetch-depth: 0
      - name: Apply recovery patch
        run: python3 .github/scripts/apply_beta27_recovery.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/main.cpp
          git -C "$GITHUB_WORKSPACE" commit -m "Avoid redundant reboot after Low UV no-boot recovery"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta27-lowuv-step-test-loop
