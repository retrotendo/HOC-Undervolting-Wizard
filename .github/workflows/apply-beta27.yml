name: Apply beta27 low UV step-test loop

on:
  push:
    branches:
      - beta27-lowuv-step-test-loop
    paths:
      - '.github/workflows/apply-beta27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta27-lowuv-step-test-loop
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta27.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/main.cpp Makefile UPDATE.txt
          git -C "$GITHUB_WORKSPACE" commit -m "Test every Low UV step before advancing in beta27"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta27-lowuv-step-test-loop
