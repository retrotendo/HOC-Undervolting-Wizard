name: Apply beta28 automatic preparation

on:
  push:
    branches:
      - beta28-auto-preparation
    paths:
      - '.github/workflows/apply-beta28-auto-preparation.yml'
      - '.github/scripts/apply_beta28.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta28-auto-preparation
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta28.py
      - name: Build
        run: make -j2
      - name: Commit patched source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/main.cpp Makefile UPDATE.txt
          git -C "$GITHUB_WORKSPACE" commit -m "Add automatic Preparation setup and reboot in beta28"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:beta28-auto-preparation
