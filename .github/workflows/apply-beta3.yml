name: Apply beta3 VMIN patch

on:
  push:
    branches:
      - beta3-vmin-validation
    paths:
      - 'tools/apply_beta3.py'
      - '.github/workflows/apply-beta3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta3 branch
        uses: actions/checkout@v4
        with:
          ref: beta3-vmin-validation

      - name: Apply beta3 source patch
        run: python3 tools/apply_beta3.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine Low VMIN search and validation"
            git push origin HEAD:beta3-vmin-validation
          fi
