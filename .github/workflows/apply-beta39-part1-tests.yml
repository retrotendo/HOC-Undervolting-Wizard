name: Apply beta39 Part 1 test flow

on:
  push:
    branches:
      - beta39-voltage-scan-final-tests
    paths:
      - 'tools/patch_beta39_part1_tests.py'
      - '.github/workflows/apply-beta39-part1-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta39-voltage-scan-final-tests
      - name: Apply Part 1 test-flow patch
        run: python3 tools/patch_beta39_part1_tests.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp
          git commit -m 'Align beta39 validation flow with OC Part 1' || exit 0
          git push origin beta39-voltage-scan-final-tests
