name: Apply beta4 guide sync

on:
  push:
    branches:
      - beta4-guide-sync
    paths:
      - 'tools/apply_beta4.py'
      - '.github/workflows/apply-beta4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta4 branch
        uses: actions/checkout@v4
        with:
          ref: beta4-guide-sync

      - name: Apply beta4 source patch
        run: python3 tools/apply_beta4.py

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git commit -m "beta4: sync wizard logic with revised battery guide" || exit 0
          git push
