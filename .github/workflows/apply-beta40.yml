name: Apply beta40 validation flow

on:
  push:
    branches:
      - beta40-validation-flow
    paths:
      - '.github/workflows/apply-beta40.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta40-validation-flow
      - name: Apply beta40 patch
        run: python3 tools/patch_beta40.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp Makefile
          git commit -m 'Implement beta40 validation flow'
          git push origin HEAD:beta40-validation-flow
