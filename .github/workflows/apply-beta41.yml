name: Apply beta41 Low VMIN minimum notice

on:
  push:
    branches:
      - beta41-low-vmin-minimum
    paths:
      - '.github/workflows/apply-beta41.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta41-low-vmin-minimum
      - name: Apply beta41 patch
        run: python3 tools/patch_beta41.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp Makefile
          git commit -m 'Add Low VMIN 570 mV minimum notice'
          git push origin HEAD:beta41-low-vmin-minimum
