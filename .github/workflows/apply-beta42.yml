name: Apply beta42 input gate fix

on:
  push:
    branches:
      - beta42-limit-notices
    paths:
      - '.github/workflows/apply-beta42.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta42-limit-notices
      - name: Fix limit-page input gate
        run: python3 tools/fix_beta42_input_gate.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp
          git commit -m 'Block search actions while Wizard limit notice is open'
          git push origin HEAD:beta42-limit-notices
