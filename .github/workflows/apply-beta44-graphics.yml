name: Apply beta44 real GUI

on:
  push:
    branches:
      - beta44-real-gui
    paths:
      - '.github/workflows/apply-beta44-graphics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta44-real-gui
      - name: Apply graphical integration
        run: python3 tools/patch_beta44_graphics.py
      - name: Commit graphical integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp source/stress_tests.cpp
          git commit -m 'Integrate real framebuffer GUI'
          git push origin HEAD:beta44-real-gui
