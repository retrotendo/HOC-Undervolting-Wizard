name: Apply beta45 startup hotfix

on:
  push:
    branches:
      - beta45-startup-hotfix
    paths:
      - '.github/workflows/apply-beta45-startup-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta45-startup-hotfix
      - name: Apply startup hotfix
        run: python3 tools/patch_beta45_startup.py
      - name: Commit startup hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp Makefile
          git commit -m 'Fix beta44 startup recursion'
          git push origin HEAD:beta45-startup-hotfix
