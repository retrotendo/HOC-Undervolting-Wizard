name: Apply beta46 modal UI

on:
  push:
    branches:
      - beta46-modal-ui
    paths:
      - '.github/workflows/apply-beta46-modal-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta46-modal-ui
      - name: Apply beta46 modal UI patch
        run: python3 tools/patch_beta46_modal_ui.py
      - name: Commit beta46 UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/gui_console.hpp source/gui_console.cpp source/updater.cpp source/main.cpp Makefile
          git commit -m 'Add full-width startup and reboot modals'
          git push origin HEAD:beta46-modal-ui
