name: Apply beta47 preparation panel

on:
  push:
    branches:
      - beta47-preparation-panel
    paths:
      - '.github/workflows/apply-beta47-preparation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta47-preparation-panel
      - name: Apply beta47 preparation patch
        run: python3 tools/patch_beta47_preparation_panel.py
      - name: Commit beta47 preparation UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/gui_console.hpp source/gui_console.cpp source/main.cpp Makefile
          git commit -m 'Add preparation SET and ACTIVE panel'
          git push origin HEAD:beta47-preparation-panel
