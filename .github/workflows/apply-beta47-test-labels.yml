name: Apply beta47 test labels

on:
  push:
    branches:
      - beta47-ux
    paths:
      - '.github/workflows/apply-beta47-test-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta47-ux
      - name: Apply beta47 test label patch
        run: python3 tools/patch_beta47_test_labels.py
      - name: Commit beta47 test labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp source/stress_tests.cpp source/stress_tests.hpp
          git commit -m 'Clarify active stability test and CPU region context'
          git push origin HEAD:beta47-ux
