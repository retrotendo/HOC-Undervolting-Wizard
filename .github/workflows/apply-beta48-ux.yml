name: Apply beta48 UX

on:
  push:
    branches:
      - beta48-ux
    paths:
      - '.github/workflows/apply-beta48-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta48-ux
      - name: Apply beta48 UX patch
        run: python3 tools/patch_beta48_ux.py
      - name: Commit beta48 UX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp source/gui_console.cpp source/gui_console.hpp Makefile
          git commit -m 'Apply beta48 guide-wide UX cleanup'
          git push origin HEAD:beta48-ux
