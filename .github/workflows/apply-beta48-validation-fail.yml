name: Apply beta48 validation cleanup

on:
  push:
    branches:
      - beta48-ux
    paths:
      - '.github/workflows/apply-beta48-validation-fail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta48-ux
      - name: Apply validation action cleanup
        run: python3 tools/patch_beta48_validation_fail.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp
          git commit -m 'Make validation actions unambiguous'
          git push origin HEAD:beta48-ux
