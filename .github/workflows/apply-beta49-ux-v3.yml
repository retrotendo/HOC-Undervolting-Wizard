name: Apply beta49 guide UX patch v3

on:
  push:
    branches:
      - beta49-guide-ux
    paths:
      - '.github/workflows/apply-beta49-ux-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta49-guide-ux
          fetch-depth: 0
      - name: Patch beta49 UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('source/main.cpp')
          s = p.read_text()

          def rep(old, new, label, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'missing: {label}')
              s = s.replace(old, new, count)

          def replace_func(name, next_name, body):
              global s
              a = s.find(f'void {name}(')
              if a < 0: raise SystemExit(f'missing function {name}')
              b = s.find(f'\nvoid {next_name}(', a)
              if b < 0: raise SystemExit(f'missing next function {next_name}')
              s = s[:a] + body.rstrip() + '\n\n' + s[b+1:]

          rep('case Stage::LowUvValidateQuick: return "CPU Low UV - Region Validation";',
              'case Stage::LowUvValidateQuick: return "CPU Low UV - Validation Test";', 'stageName LowUV')
          rep('case Stage::LowVminPlateauValidate: return "CPU Low VMIN - Region Validation";',
              'case Stage::LowVminPlateauValidate: return "CPU Low VMIN - Validation Test";', 'stageName LowVMIN')

          # footerTest via regex to avoid whitespace sensitivity.
          s, n = re.subn(r'void footerTest\(int row\) \{.*?\n\}', '''void footerTest(int row) {
              const bool candidateTest = g.stage == Stage::VddqQuick ||
                                         g.stage == Stage::Vdd2Quick ||
                                         g.stage == Stage::HighUvQuick;
              if (candidateTest) {
                  uiPrintf(row,     "A : Start 1-minute stability test");
                  uiPrintf(row + 1, "+ : Known stable / Skip stability test");
              } else {
                  uiPrintf(row,     "A : Start validation test");
                  uiPrintf(row + 1, "+ : Known PASS / Skip validation test");
              }
              uiPrintf(row + 2, "B : Exit");
              printResetHint(row + 2);
          }''', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('footerTest regex failed')

          replace_func('renderVminScanScreen', 'renderHardwareDetection', '''void renderVminScanScreen() {
              guiPageClear();
              if (!g_vminScanSuccess) {
                  uiPrintf(5, "Automatic voltage scan stopped.");
                  if (!g_vminScanErrorText.empty()) uiPrintf(7, "%s", g_vminScanErrorText.c_str());
                  if (g_vminScanErrorRc) uiPrintf(8, "Result : 0x%08X", g_vminScanErrorRc);
                  uiPrintf(13, "A : Retry voltage scan");
                  uiPrintf(14, "B : Back");
                  uiPresent();
                  return;
              }
              uiPrintf(5, "Automatic scan complete.");
              uiPrintf(7, "The Wizard found %d voltage region%s to validate.",
                       g.vminValidateCount, g.vminValidateCount == 1 ? "" : "s");
              int row = 9;
              for (int i = 0; i < g.vminValidateCount && i < 6; ++i)
                  uiPrintf(row++, "%d. %s @ ~%d mV", i + 1,
                           formatClock(g.vminValidateHz[i]).c_str(), g.vminValidateMv[i]);
              row++;
              uiPrintf(row++, "Each region will be tested for 1 minute.");
              row++;
              uiPrintf(row++, "A : Start validation test");
              uiPrintf(row++, "+ : Known PASS / Skip validation test");
              uiPrintf(row++, "B : Exit");
              printResetHint(row - 1);
              uiPresent();
          }''')

          replace_func('renderValidationObjective', 'renderTestStage', '''void renderValidationObjective(int& row) {
              switch (g.stage) {
                  case Stage::VddqQuick:
                      uiPrintf(row++, "This 1-minute test checks the current VDDQ candidate.");
                      uiPrintf(row++, "Candidate : %d mV", g.vddqTest);
                      break;
                  case Stage::VddqLong:
                      uiPrintf(row++, "This test validates the final VDDQ value.");
                      uiPrintf(row++, "VDDQ : %d mV", g.vddqGood);
                      break;
                  case Stage::Vdd2Quick:
                      uiPrintf(row++, "This 1-minute test checks the current VDD2 candidate.");
                      uiPrintf(row++, "Candidate : %s", formatVdd2(g.vdd2TestUv).c_str());
                      break;
                  case Stage::Vdd2Long:
                      uiPrintf(row++, "This test validates the final RAM voltage pair.");
                      uiPrintf(row++, "VDDQ : %d mV", g.vddqGood);
                      uiPrintf(row++, "VDD2 : %s", formatVdd2(g.vdd2GoodUv).c_str());
                      break;
                  case Stage::RamBoostValidate:
                      uiPrintf(row++, "This test validates tuned RAM at Nintendo Boost clocks.");
                      uiPrintf(row++, "VDDQ : %d mV", g.vddqGood);
                      uiPrintf(row++, "VDD2 : %s", formatVdd2(g.vdd2GoodUv).c_str());
                      break;
                  case Stage::Ram1331Validate:
                      uiPrintf(row++, "This test validates tuned RAM at handheld clocks.");
                      uiPrintf(row++, "VDDQ : %d mV", g.vddqGood);
                      uiPrintf(row++, "VDD2 : %s", formatVdd2(g.vdd2GoodUv).c_str());
                      break;
                  case Stage::HighUvQuick:
                      uiPrintf(row++, "This 1-minute test checks the current High UV candidate.");
                      uiPrintf(row++, "Candidate : %d", g.highUvTest);
                      break;
                  case Stage::HighUvLong:
                      uiPrintf(row++, "This test validates the final High UV value.");
                      uiPrintf(row++, "High UV : %d", g.highUvGood);
                      break;
                  case Stage::BoostCpuRamValidate:
                      uiPrintf(row++, "This test validates High UV at Nintendo Boost clocks.");
                      uiPrintf(row++, "CPU / GPU / RAM : 1785 / 76.8 / 1600 MHz");
                      break;
                  case Stage::NormalMatrixValidate:
                      uiPrintf(row++, "This test validates CPU + RAM at handheld clocks.");
                      uiPrintf(row++, "CPU / GPU / RAM : 1020 / 384 / 1331 MHz");
                      break;
                  case Stage::BoostCpuMemValidate:
                      uiPrintf(row++, "This test validates High UV together with tuned RAM.");
                      uiPrintf(row++, "CPU / GPU / RAM : 1785 / 76.8 / 1600 MHz");
                      break;
                  case Stage::NormalMemValidate: uiPrintf(row++, "This test validates RAM at handheld clocks."); break;
                  case Stage::NormalGpuValidate: uiPrintf(row++, "This test validates GPU stability at handheld clocks."); break;
                  case Stage::BoostMatrixValidate: uiPrintf(row++, "This test validates CPU stability at Boost clocks."); break;
                  case Stage::BoostMemValidate: uiPrintf(row++, "This test validates RAM stability at Boost clocks."); break;
                  case Stage::LowVminFinalLong:
                      uiPrintf(row++, "This test validates the final Low VMIN value.");
                      uiPrintf(row++, "Low VMIN : %d mV", g.lowVminGood);
                      break;
                  default: uiPrintf(row++, "This test validates the current tuned settings."); break;
              }
              row++;
          }''')

          # Replace validation-region body using stable boundaries.
          a = s.find('    if (g.stage == Stage::LowUvValidateQuick || g.stage == Stage::LowVminPlateauValidate) {')
          b = s.find('    stress::Kind kind;', a)
          if a < 0 or b < 0: raise SystemExit('validation region boundaries missing')
          s = s[:a] + '''    if (g.stage == Stage::LowUvValidateQuick || g.stage == Stage::LowVminPlateauValidate) {
              uiPrintf(row++, "Voltage regions to validate : %d", g.vminValidateCount);
              row++;
              for (int i = 0; i < g.vminValidateCount && i < 6; ++i)
                  uiPrintf(row++, "%d. %s @ ~%d mV", i + 1,
                           formatClock(g.vminValidateHz[i]).c_str(), g.vminValidateMv[i]);
              row++;
              uiPrintf(row++, "Each region will be tested for 1 minute.");
              row++;
              uiPrintf(row++, "A : Start validation test");
              uiPrintf(row++, "+ : Known PASS / Skip validation test");
              uiPrintf(row++, "B : Exit");
              printResetHint(row - 1);
              return;
          }

''' + s[b:]

          # Replace general hasTest block by boundaries, not exact whitespace.
          a = s.find('    const bool hasTest = testPlan(g.stage, kind, seconds);')
          b = s.find('\n}\n\n\nvoid renderRealWorld()', a)
          if a < 0 or b < 0: raise SystemExit('hasTest boundaries missing')
          prefix = '''    const bool hasTest = testPlan(g.stage, kind, seconds);
              if (hasTest) {
                  renderValidationObjective(row);
                  const bool candidateTest = g.stage == Stage::VddqQuick ||
                                             g.stage == Stage::Vdd2Quick ||
                                             g.stage == Stage::HighUvQuick;
                  uiPrintf(row++, candidateTest ? "Stability test : %s" : "Validation test : %s",
                           seconds == 60 ? "1 minute" : (seconds == 1800 ? "30 minutes" : "1 hour"));
                  uiPrintf(row++, "Test type : %s", compactTestName(kind));
                  footerTest(row + 1);
              }'''
          s = s[:a] + prefix + s[b:]

          rep('uiPrintf(17, "+ : Known PASS / Skip step");',
              'uiPrintf(17, "+ : Known PASS / Skip real-world test");', 'real-world skip')
          rep('case Stage::LowUvValidateQuick: return "CPU Low UV - Region Test";',
              'case Stage::LowUvValidateQuick: return "CPU Low UV - Validation Test";', 'compact LowUV')
          rep('case Stage::LowVminPlateauValidate: return "CPU Low VMIN - Plateau";',
              'case Stage::LowVminPlateauValidate: return "CPU Low VMIN - Validation Test";', 'compact LowVMIN')

          # Right-side task language.
          rep('''    } else if (g_vminScanScreen) {
              v.instructionTitle = "CPU voltage scan";
              v.instructionLine1 = "Review scan result";
              v.instructionLine2 = "Continue when ready";
          }''', '''    } else if (g_vminScanScreen) {
              if (g_vminScanSuccess) {
                  v.instructionTitle = "Start the validation test";
                  v.instructionLine1 = std::to_string(g.vminValidateCount) +
                      (g.vminValidateCount == 1 ? " voltage region found" : " voltage regions found");
                  v.instructionLine2 = "A : Start test";
              } else {
                  v.instructionTitle = "Retry the voltage scan";
                  v.instructionLine1 = "The automatic scan stopped";
                  v.instructionLine2 = "A : Retry scan";
              }
          }''', 'scan task')

          rep('''    } else if (g.stage == Stage::RealWorldValidate) {
              v.instructionTitle = "Real-world validation";''', '''    } else if (g.stage == Stage::LowUvValidateQuick || g.stage == Stage::LowVminPlateauValidate) {
              v.instructionTitle = "Start the validation test";
              v.instructionLine1 = std::to_string(g.vminValidateCount) +
                  (g.vminValidateCount == 1 ? " voltage region to test" : " voltage regions to test");
              v.instructionLine2 = "A : Start test";
          } else if (g.stage == Stage::RealWorldValidate) {
              v.instructionTitle = "Run the real-world test";''', 'region task')

          rep('''    } else {
              const std::string d = guiDurationForStage(g.stage);
              if (!d.empty()) {
                  v.instructionTitle = "Start stability test";
                  v.instructionLine1 = stageName(g.stage);
                  v.instructionLine2 = d;
              } else {
                  v.instructionTitle = stageName(g.stage);
                  v.instructionLine1 = "Follow the guide";
                  v.instructionLine2 = "Choose an action";
              }
          }''', '''    } else {
              const std::string d = guiDurationForStage(g.stage);
              if (!d.empty()) {
                  const bool candidateTest = g.stage == Stage::VddqQuick ||
                                             g.stage == Stage::Vdd2Quick ||
                                             g.stage == Stage::HighUvQuick;
                  v.instructionTitle = candidateTest ? "Start the stability test" : "Start the validation test";
                  v.instructionLine1 = candidateTest ? "Test the current candidate" : "Validate the current tuned settings";
                  v.instructionLine2 = "A : Start test";
              } else {
                  v.instructionTitle = stageName(g.stage);
                  v.instructionLine1 = "Follow the guide";
                  v.instructionLine2 = "Choose an action";
              }
          }''', 'generic task')

          p.write_text(s)

          p = Path('source/gui_console.cpp')
          s = p.read_text()
          marker = "            const size_t colon = raw.find(':');\n"
          i = s.find(marker)
          if i < 0: raise SystemExit('gui colon marker missing')
          insert = '''            const bool numberedRow = raw.size() >= 3 && std::isdigit(static_cast<unsigned char>(raw[0])) &&
                                     raw[1] == '.' && raw[2] == ' ';
              if (numberedRow) {
                  drawText(x + 28, by, 15, C_TEXT, fitText(raw, 15, w - 56));
                  by += 22;
                  ++shown;
                  continue;
              }

'''
          s = s[:i] + insert + s[i:]
          p.write_text(s)

          p = Path('Makefile')
          s = p.read_text()
          if 'APP_VERSION := 0.4.0-beta.48' not in s: raise SystemExit('beta48 version missing')
          p.write_text(s.replace('APP_VERSION := 0.4.0-beta.48', 'APP_VERSION := 0.4.0-beta.49', 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp source/gui_console.cpp Makefile
          git commit -m "Apply beta49 consistent guide UX"
          git push origin HEAD:beta49-guide-ux
