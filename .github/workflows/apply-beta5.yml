name: Apply beta5 VMIN probe

on:
  push:
    branches:
      - beta5-vmin-probe
    paths:
      - 'tools/apply_beta5.py'
      - '.github/workflows/apply-beta5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta5-vmin-probe
      - name: Apply beta5 source patch
        run: python3 tools/apply_beta5.py
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "beta5: make VMIN sweep measurement-only" || exit 0
          git push origin beta5-vmin-probe
