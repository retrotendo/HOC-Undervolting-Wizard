name: Apply beta6 applet blocker

on:
  push:
    branches:
      - beta6-applet-block
    paths:
      - 'tools/add_beta6_applet_block.py'
      - '.github/workflows/apply-beta6-applet-block.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta6-applet-block
      - run: python3 tools/add_beta6_applet_block.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp Makefile README.md CHANGELOG.md RELEASE_NOTES_v0.4.0-beta.6.md .github/workflows/release-v0.4.0-beta.6.yml
          git commit -m "beta6: block Applet Mode at startup" || exit 0
          git push origin beta6-applet-block
