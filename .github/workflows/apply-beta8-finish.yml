name: Apply beta8 final updater patch

on:
  push:
    branches:
      - beta8-self-updater
    paths:
      - 'tools/apply_beta8_finish.py'
      - '.github/workflows/apply-beta8-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta8-self-updater
      - run: python3 tools/apply_beta8_finish.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/updater.cpp README.md CHANGELOG.md THIRD_PARTY_LICENSES.md
          git commit -m "beta8: finalize updater docs and safety" || exit 0
          git push origin beta8-self-updater
