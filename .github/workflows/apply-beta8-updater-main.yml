name: Apply beta8 updater integration

on:
  push:
    branches:
      - beta8-self-updater
    paths:
      - 'tools/apply_beta8_updater_main.py'
      - '.github/workflows/apply-beta8-updater-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta8-self-updater
      - run: python3 tools/apply_beta8_updater_main.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "beta8: integrate startup updater" || exit 0
          git push origin beta8-self-updater
