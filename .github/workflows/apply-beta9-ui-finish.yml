name: Apply beta9 UI finish

on:
  push:
    branches:
      - beta9-ultrahand-ui
    paths:
      - 'tools/apply_beta9_ui_finish.py'
      - '.github/workflows/apply-beta9-ui-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta9-ultrahand-ui
      - run: python3 tools/apply_beta9_ui_finish.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "beta9: finish right-side UI layout" || exit 0
          git push origin beta9-ultrahand-ui
