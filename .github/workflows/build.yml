name: Build NRO

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply renamed app paths/title
        run: |
          sed -i 's|sdmc:/switch/HOC-Battery-Wizard|sdmc:/switch/HOC-Undervolting-Wizard|g' source/main.cpp
          sed -i 's|/switch/HOC-Battery-Wizard|/switch/HOC-Undervolting-Wizard|g' source/main.cpp
          sed -i 's|HOC Battery Wizard|HOC Undervolting Wizard|g' source/main.cpp

      - name: Build
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: HOC-Undervolting-Wizard
          path: HOC-Undervolting-Wizard.nro
