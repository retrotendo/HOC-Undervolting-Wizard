name: Build NRO

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GUI font dependency
        run: dkp-pacman -Syu --noconfirm switch-freetype

      - name: Build
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: HOC-Undervolting-Wizard-build
          path: HOC-Undervolting-Wizard.nro
