name: Apply beta31 Y-button fix

on:
  push:
    branches:
      - beta31-ui-wrap
    paths:
      - 'tools/patch_beta31_y_fix.py'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta31-ui-wrap
      - name: Patch Y-button flow
        run: python3 tools/patch_beta31_y_fix.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git diff --cached --check
          git commit -m "Fix beta31 Preparation Y-button auto-set flow"
          git push origin HEAD:beta31-ui-wrap
