name: Apply beta33 UI consistency patch

on:
  push:
    branches:
      - beta33-ui-consistency
    paths:
      - 'tools/patch_beta33_ui.py'
      - '.github/workflows/commit-beta33-ui.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta33-ui-consistency
      - name: Apply UI patch
        run: python3 tools/patch_beta33_ui.py
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile
          git diff --cached --check
          git commit -m "Unify beta33 setting UI layout"
          git push origin HEAD:beta33-ui-consistency
