name: Apply beta34 wording patch

on:
  push:
    branches:
      - beta34-reset-layout
    paths:
      - 'tools/patch_beta34_copy.py'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta34-reset-layout
      - name: Apply wording patch
        run: python3 tools/patch_beta34_copy.py
      - name: Commit wording changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git diff --cached --check
          git commit -m "Use singular and plural setting wording correctly"
          git push origin HEAD:beta34-reset-layout
