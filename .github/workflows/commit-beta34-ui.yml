name: Apply beta34 UI patch

on:
  push:
    branches:
      - beta34-reset-layout
    paths:
      - 'tools/patch_beta34_ui.py'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta34-reset-layout
      - name: Apply beta34 UI patch
        run: python3 tools/patch_beta34_ui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile
          git diff --cached --check
          git commit -m "Adjust beta34 reset placement and skip wording"
          git push origin HEAD:beta34-reset-layout
