name: Apply beta35 patch

on:
  push:
    branches:
      - beta35-direct-stability
    paths:
      - '.github/workflows/commit-beta35.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta35-direct-stability
      - name: Apply patch
        run: python3 tools/patch_beta35.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "Streamline automatic stability test start" || exit 0
          git push
