name: Apply beta36 reboot fix

on:
  push:
    branches:
      - beta36-recovery-skip
    paths:
      - '.github/workflows/commit-beta36-reboot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta36-recovery-skip
      - name: Apply reboot fix
        run: python3 tools/patch_beta36_reboot.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "Force reboot after Low UV and Low VMIN candidate set" || exit 0
          git push
