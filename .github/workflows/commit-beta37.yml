name: Apply beta37 consistency patch

on:
  push:
    branches:
      - beta37-consistent-tests
    paths:
      - '.github/workflows/commit-beta37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta37-consistent-tests
      - name: Apply beta37 patch
        run: python3 tools/patch_beta37.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp
          git commit -m "Unify automatic stability test flow" || exit 0
          git push
