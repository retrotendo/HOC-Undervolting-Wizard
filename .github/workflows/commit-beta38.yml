name: Apply beta38 known-unstable patch

on:
  push:
    branches:
      - beta38-known-unstable
    paths:
      - '.github/workflows/commit-beta38.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta38-known-unstable
      - name: Apply beta38 patch
        run: python3 tools/patch_beta38.py
      - name: Commit clean beta38 patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/patch_beta38.py .github/workflows/commit-beta38.yml
          git add source/main.cpp Makefile
          git commit -m "Add Known unstable action to search pages"
          git push
