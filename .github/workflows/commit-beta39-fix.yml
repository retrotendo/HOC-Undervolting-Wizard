name: Apply beta39 patch (fixed)

on:
  push:
    branches:
      - beta39-voltage-scan-final-tests
    paths:
      - '.github/workflows/commit-beta39-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta39-voltage-scan-final-tests
      - name: Fix helper and apply beta39 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/patch_beta39.py')
          s = p.read_text()
          a = s.index('# beta39 final validation:')
          b = s.index('# Existing saved beta38 states', a)
          fixed = '''# beta39 final validation: keep the meaningful integration tests, skip the
          # redundant duplicate RAM/GPU/Boost passes at the very end.
          old_final = """        case Stage::BoostCpuRamValidate: g.stage = Stage::NormalMatrixValidate; break;
                  case Stage::NormalMatrixValidate: g.stage = Stage::NormalMemValidate; break;
                  case Stage::NormalMemValidate: g.stage = Stage::NormalGpuValidate; break;
                  case Stage::NormalGpuValidate: g.stage = Stage::BoostMatrixValidate; break;
                  case Stage::BoostMatrixValidate: g.stage = Stage::BoostMemValidate; break;
                  case Stage::BoostMemValidate: g.stage = Stage::BoostCpuMemValidate; break;
                  case Stage::BoostCpuMemValidate: g.stage = Stage::RealWorldValidate; break;"""
          new_final = """        case Stage::BoostCpuRamValidate: g.stage = Stage::NormalMatrixValidate; break;
                  case Stage::NormalMatrixValidate: g.stage = Stage::RealWorldValidate; break;
                  case Stage::NormalMemValidate:
                  case Stage::NormalGpuValidate:
                  case Stage::BoostMatrixValidate:
                  case Stage::BoostMemValidate:
                  case Stage::BoostCpuMemValidate:
                      // Legacy beta states: these tests are redundant in beta39+.
                      g.stage = Stage::RealWorldValidate;
                      break;"""
          rep(old_final, new_final, 'final validation transitions')

          '''
          p.write_text(s[:a] + fixed + s[b:])
          PY
          python3 tools/patch_beta39.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp Makefile
          git commit -m "Improve voltage scan and trim redundant final tests" || exit 0
          git push
