name: Fix beta5 probe applied clock

on:
  push:
    branches:
      - beta5-vmin-probe
    paths:
      - 'tools/fix_beta5_probe_clock.py'
      - '.github/workflows/fix-beta5-probe-clock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta5-vmin-probe
      - run: python3 tools/fix_beta5_probe_clock.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/main.cpp README.md CHANGELOG.md RELEASE_NOTES_v0.4.0-beta.5.md
          git commit -m "beta5: require applied CPU clock for VMIN probe" || exit 0
          git push origin beta5-vmin-probe
