name: Fix and run beta16 guided flow

on:
  push:
    branches:
      - beta15-guided-reboot-vmin-plateaus
    paths:
      - 'tools/fix_apply_beta16.py'

permissions:
  contents: write

jobs:
  fix-patch-build-commit:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair beta16 patch helper
        run: python3 tools/fix_apply_beta16.py
      - name: Apply beta16 flow
        run: python3 tools/apply_beta16_flow.py
      - name: Build patched source
        run: make -j2
      - name: Commit patched source
        run: |
          git config user.name "retrotendo"
          git config user.email "info@retrotendo.de"
          git add source/main.cpp Makefile UPDATE.txt RELEASE_NOTES_v0.4.0-beta.16.md README.md
          git diff --cached --quiet && exit 0
          git commit -m "beta16: guided reboot and automatic VMIN plateau flow"
          git push origin HEAD:beta15-guided-reboot-vmin-plateaus
