name: Fix v1 GUI compile

on:
  push:
    branches:
      - v1-gui-beta
    paths:
      - '.github/workflows/fix-v1-gui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-gui-beta
      - name: Apply compatibility fix
        run: python3 tools/fix_v1_gui_compile.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp
          git commit -m 'Fix legacy UI column reference'
          git push origin HEAD:v1-gui-beta
