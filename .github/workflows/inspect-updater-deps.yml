name: Inspect updater deps

on:
  push:
    branches:
      - beta8-self-updater
    paths:
      - '.github/workflows/inspect-updater-deps.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Inspect curl availability
        shell: bash
        run: |
          echo '--- libcurl pkg-config ---'
          cat /opt/devkitpro/portlibs/switch/lib/pkgconfig/libcurl.pc || true
          echo '--- pkg-config static libs ---'
          PKG_CONFIG_LIBDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig pkg-config --static --libs libcurl || true
          echo '--- pkg-config cflags ---'
          PKG_CONFIG_LIBDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig pkg-config --cflags libcurl || true
