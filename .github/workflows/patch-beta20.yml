name: Patch beta20 hardware detection
on:
  push:
    branches: [ beta20-hardware-detect-fix ]
permissions:
  contents: write
jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta20-hardware-detect-fix
          fetch-depth: 0
      - name: Patch hardware validation and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/hoc_monitor.c')
          s = p.read_text()
          old = '''    s32 consoleType = -1;\n    memcpy(&consoleType, bytes + 408, sizeof(consoleType));\n    if (consoleType < 0 || consoleType > 3)\n        return 3;\n\n'''
          new = '''    /* consoleType is not ABI-stable across HOC 2.6.x context layouts.\n     * It is not needed to choose the RAM/VDDQ baseline, so do not reject an\n     * otherwise unambiguous DRAM identification because of this field. */\n    s32 consoleType = -1;\n    memcpy(&consoleType, bytes + 408, sizeof(consoleType));\n\n'''
          if old not in s:
              raise SystemExit('consoleType validation block not found')
          p.write_text(s.replace(old, new, 1))
          p = Path('Makefile')
          s = p.read_text()
          if 'APP_VERSION := 0.4.0-beta.19' not in s:
              raise SystemExit('beta19 version not found')
          p.write_text(s.replace('APP_VERSION := 0.4.0-beta.19', 'APP_VERSION := 0.4.0-beta.20', 1))
          Path('UPDATE.txt').write_text(
              'version=0.4.0-beta.20\n'
              'nro_url=https://github.com/retrotendo/HOC-Undervolting-Wizard/releases/download/v0.4.0-beta.20/HOC-Undervolting-Wizard.nro\n'
              'sha_url=https://github.com/retrotendo/HOC-Undervolting-Wizard/releases/download/v0.4.0-beta.20/HOC-Undervolting-Wizard.nro.sha256\n'
          )
          Path('RELEASE_NOTES_beta20.md').write_text('''# HOC Undervolting Wizard v0.4.0-beta.20\n\nFixes RAM hardware detection with Horizon OC 2.6.x context layouts.\n\n- keeps dual-layout DRAM-ID detection\n- stops treating the non-stable `consoleType` field as a hard requirement\n- an unambiguous known DRAM ID plus valid 8 GB flag is now sufficient\n- no tuning/test logic changes\n''')
          PY
      - name: Build NRO
        shell: bash
        run: make -j2
      - name: Commit patch
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add source/hoc_monitor.c Makefile UPDATE.txt RELEASE_NOTES_beta20.md
          git -C "$GITHUB_WORKSPACE" commit -m "Fix HOC 2.6.x RAM detection"
          git -C "$GITHUB_WORKSPACE" push origin beta20-hardware-detect-fix
