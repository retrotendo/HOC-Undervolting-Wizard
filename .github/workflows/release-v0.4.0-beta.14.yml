name: Publish v0.4.0-beta.14

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.4.0-beta.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO
        run: make -j2

      - name: Create checksum
        run: sha256sum HOC-Undervolting-Wizard.nro > HOC-Undervolting-Wizard.nro.sha256

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-beta.14
          target_commitish: main
          name: HOC Undervolting Wizard v0.4.0-beta.14
          body_path: RELEASE_NOTES_v0.4.0-beta.14.md
          prerelease: true
          make_latest: false
          files: |
            HOC-Undervolting-Wizard.nro
            HOC-Undervolting-Wizard.nro.sha256
