name: Release v1.0.0-beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.0-beta.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j2

      - name: Create SHA256
        run: sha256sum HOC-Undervolting-Wizard.nro > HOC-Undervolting-Wizard.nro.sha256

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta
          name: v1.0.0-beta
          prerelease: true
          body_path: RELEASE_NOTES_v1.0.0-beta.md
          files: |
            HOC-Undervolting-Wizard.nro
            HOC-Undervolting-Wizard.nro.sha256
