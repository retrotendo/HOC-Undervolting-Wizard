name: Run beta49 patch

on:
  push:
    branches:
      - beta49-guide-ux
    paths:
      - '.github/workflows/run-beta49-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta49-guide-ux
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_beta49.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp source/gui_console.cpp Makefile
          git commit -m "Apply beta49 consistent guide UX"
          git push origin HEAD:beta49-guide-ux
