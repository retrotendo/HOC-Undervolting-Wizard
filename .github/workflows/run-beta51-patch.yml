name: Run beta51 state guard patch

on:
  push:
    branches:
      - beta51-wizard-state-guard
    paths:
      - '.github/workflows/run-beta51-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: beta51-wizard-state-guard
          fetch-depth: 0

      - name: Apply beta51 patch
        run: python3 .github/scripts/apply_beta51.py

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.cpp Makefile
          git commit -m 'Apply beta51 wizard state guard' || exit 0
          git push origin HEAD:beta51-wizard-state-guard
