name: Run beta52 UI patch

on:
  push:
    branches:
      - beta52-build
    paths:
      - '.github/scripts/apply_beta52.py'
      - '.github/workflows/run-beta52-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: beta52-build
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply beta52 patch
        run: python3 .github/scripts/apply_beta52.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp source/gui_console.cpp source/gui_console.hpp Makefile
          git commit -m "Apply beta52 real-world and results layout" || exit 0
          git push origin beta52-build
