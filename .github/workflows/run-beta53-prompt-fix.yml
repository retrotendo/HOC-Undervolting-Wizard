name: Run beta53 final save prompt patch

on:
  push:
    branches:
      - beta53-performance-modes-save
    paths:
      - '.github/scripts/apply_beta53_prompt_fix.py'
      - '.github/workflows/run-beta53-prompt-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: beta53-performance-modes-save
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply beta53 final prompt patch
        run: python3 .github/scripts/apply_beta53_prompt_fix.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp README.md
          git commit -m "Use explicit final Performance Modes save prompt" || exit 0
          git push origin beta53-performance-modes-save
