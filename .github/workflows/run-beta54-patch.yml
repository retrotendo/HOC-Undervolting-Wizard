name: Run beta54 readability patch

on:
  push:
    branches:
      - beta54-ui-readability
    paths:
      - '.github/scripts/apply_beta54.py'
      - '.github/workflows/run-beta54-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: beta54-ui-readability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply beta54 patch
        run: python3 .github/scripts/apply_beta54.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile README.md
          git commit -m "Simplify final UI text for readability" || exit 0
          git push origin beta54-ui-readability
