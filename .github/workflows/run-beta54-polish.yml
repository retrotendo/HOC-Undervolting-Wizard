name: Run beta54 final readability polish

on:
  push:
    branches:
      - beta54-ui-readability
    paths:
      - '.github/scripts/polish_beta54.py'
      - '.github/workflows/run-beta54-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: beta54-ui-readability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply beta54 polish
        run: python3 .github/scripts/polish_beta54.py
      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git commit -m "Polish final readability text" || exit 0
          git push origin beta54-ui-readability
