name: Run beta55 readability patch

on:
  push:
    branches:
      - beta55-final-readability
    paths:
      - '.github/scripts/apply_beta55.py'
      - '.github/workflows/run-beta55-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: beta55-final-readability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply beta55 patch
        run: python3 .github/scripts/apply_beta55.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp Makefile README.md
          git commit -m "Simplify real-world guidance layout" || exit 0
          git push origin beta55-final-readability
