name: Update beta5 README

on:
  push:
    branches:
      - beta5-vmin-probe
    paths:
      - 'tools/update_beta5_docs.py'
      - '.github/workflows/update-beta5-docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta5-vmin-probe
      - run: python3 tools/update_beta5_docs.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "beta5: document measurement-only VMIN probe" || exit 0
          git push origin beta5-vmin-probe
